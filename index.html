<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Sカード専用タイムカード</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
header{background:#111827;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
h1{font-size:21px;margin:0 0 4px}.sub{font-size:12px;opacity:.75}
main{max-width:720px;margin:auto;padding:12px 12px 40px}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px #0000000b}
.title{font-weight:800;margin-bottom:10px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.tab,.addtab{border:0;border-radius:10px;padding:9px 13px;font-weight:700;white-space:nowrap}.tab{background:#fff}.tab.active{background:#111827;color:#fff}.addtab{background:#e5e7eb}
input{font:inherit}.text,.wage{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:10px}
.two{display:flex;gap:8px}.two>*{flex:1}
input[type=file]{width:100%;padding:10px;border:1px dashed #9ca3af;border-radius:10px;background:#f9fafb}
.preview{width:100%;max-height:420px;object-fit:contain;background:#111;border-radius:10px;margin-top:10px}.crop{width:100%;max-height:350px;object-fit:contain;border-radius:10px;margin-top:10px;border:1px solid #e5e7eb}
.hidden{display:none}
button{font:inherit}.primary{width:100%;border:0;background:#111827;color:#fff;padding:13px;border-radius:11px;font-weight:800;margin-top:10px}.secondary{border:0;background:#e5e7eb;padding:10px 13px;border-radius:10px;font-weight:700}
.status{font-size:12px;margin-top:8px;min-height:18px}.ok{color:#047857}.err{color:#b91c1c}
.grid{display:grid;grid-template-columns:45px 1fr 1fr 32px;gap:6px}.head{font-size:12px;color:#6b7280;text-align:center;font-weight:700}.cell{width:100%;padding:9px 4px;border:1px solid #d1d5db;border-radius:9px;text-align:center;font-size:15px}.del{background:#fee2e2;color:#991b1b;border:0;border-radius:8px;padding:8px}
.results{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box{background:#f9fafb;border-radius:12px;padding:12px;text-align:center}.num{font-size:23px;font-weight:900}.pay{background:#ecfdf5;border:1px solid #a7f3d0}.hint{font-size:11px;color:#6b7280;text-align:center;margin-top:7px}
.note{font-size:12px;color:#6b7280;line-height:1.5}.check{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<header><h1>⏱ Sカード専用タイムカード</h1><div class="sub">このカードの表だけを狙って読み取ります</div></header>
<main>
<div id="tabs" class="tabs"></div>

<section class="card">
<div class="title">👤 個人設定</div>
<div class="two"><input id="name" class="text" placeholder="名前"><input id="wage" class="wage" type="number" inputmode="numeric" min="0" placeholder="時給（円）"></div>
</section>

<section class="card">
<div class="title">📷 タイムカード画像</div>
<input id="file" type="file" accept="image/*,.jpg,.jpeg,.png,.heic">
<div class="note">元のタイムカード写真を選んでください。スクリーンショットではなく、撮影した元画像のほうが読み取りやすいです。</div>
<img id="preview" class="preview hidden">
<img id="crop" class="crop hidden">
<div id="status" class="status"></div>
<button id="read" class="primary" disabled>🔎 Sカードを読み取る</button>
<label class="check"><input id="showCrop" type="checkbox"> 読み取り範囲を表示する</label>
</section>

<section class="card">
<div class="title">🕐 読み取り結果（修正できます）</div>
<div class="grid">
<div class="head">日</div><div class="head">出勤</div><div class="head">退勤</div><div></div>
</div>
<div id="rows"></div>
<button id="add" class="secondary" style="margin-top:10px">＋ 行を追加</button>
</section>

<section class="card">
<div class="title">💰 計算結果</div>
<div class="results">
<div class="box"><div class="hint">合計勤務時間</div><div id="hours" class="num">0時間00分</div></div>
<div class="box pay"><div class="hint">給与</div><div id="pay" class="num">¥0</div></div>
</div>
<div id="formula" class="hint">時給 × 合計勤務時間</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const STORE="s_card_v3";
let people=JSON.parse(localStorage.getItem(STORE)||"null")||[{id:crypto.randomUUID(),name:"個人1",wage:0,rows:[]}];
let pid=people[0].id;
const $=id=>document.getElementById(id), P=()=>people.find(p=>p.id===pid);
function save(){localStorage.setItem(STORE,JSON.stringify(people))}
function renderTabs(){let x=$("tabs");x.innerHTML="";people.forEach(p=>{let b=document.createElement("button");b.className="tab"+(p.id===pid?" active":"");b.textContent=p.name;b.onclick=()=>{pid=p.id;render()};x.appendChild(b)});let a=document.createElement("button");a.className="addtab";a.textContent="＋ 個人";a.onclick=()=>{let p={id:crypto.randomUUID(),name:"個人"+(people.length+1),wage:0,rows:[]};people.push(p);pid=p.id;save();render()};x.appendChild(a)}
function render(){renderTabs();$("name").value=P().name;$("wage").value=P().wage||"";draw();calc()}
function addRow(day="",start="",end=""){let d=document.createElement("div");d.style.cssText="display:grid;grid-template-columns:45px 1fr 1fr 32px;gap:6px;margin-top:7px";d.innerHTML=`<input class="cell day" placeholder="3" value="${day}"><input class="cell st" placeholder="19:08" value="${start}"><input class="cell en" placeholder="23:07" value="${end}"><button class="del">×</button>`;d.querySelector(".del").onclick=()=>{d.remove();sync();calc()};d.querySelectorAll("input").forEach(e=>e.oninput=()=>{sync();calc()});$("rows").appendChild(d)}
function draw(){let r=$("rows");r.innerHTML="";if(!P().rows.length){addRow();return}P().rows.forEach(x=>addRow(x.day,x.start,x.end))}
function sync(){P().rows=[...$("rows").children].map(r=>({day:r.querySelector(".day").value,start:r.querySelector(".st").value,end:r.querySelector(".en").value}));save()}
function norm(s){s=(s||"").replace(/[：.,]/g,":").replace(/\s/g,"").replace(/[Oo]/g,"0").replace(/[Il]/g,"1");let m=s.match(/(\d{1,2}):?(\d{2})/);if(!m)return null;let h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return String(h).padStart(2,"0")+":"+String(mi).padStart(2,"0")}
function minutes(s){let [h,m]=s.split(":").map(Number);return h*60+m}
function calc(){let total=0;P().rows.forEach(r=>{let a=norm(r.start),b=norm(r.end);if(a&&b){let x=minutes(a),y=minutes(b);if(y<x)y+=1440;total+=y-x}});$("hours").textContent=Math.floor(total/60)+"時間"+String(total%60).padStart(2,"0")+"分";let w=+P().wage||0,pay=Math.round(total*w/60);$("pay").textContent="¥"+pay.toLocaleString("ja-JP");$("formula").textContent=`${w.toLocaleString("ja-JP")}円 × ${(total/60).toFixed(2)}時間 = ¥${pay.toLocaleString("ja-JP")}`;save()}
$("name").oninput=()=>{P().name=$("name").value||"名前なし";save();renderTabs()};$("wage").oninput=calc;$("add").onclick=()=>{addRow();sync();calc()};

let sourceImage=null,sourceCanvas=null;
const file=$("file"),preview=$("preview"),crop=$("crop"),read=$("read"),status=$("status");
file.onchange=()=>{let f=file.files?.[0];if(!f)return;preview.src=URL.createObjectURL(f);preview.classList.remove("hidden");read.disabled=false;status.textContent="写真を選択しました。";sourceImage=new Image();sourceImage.src=preview.src;sourceImage.onload=()=>{sourceCanvas=makeTableCrop(sourceImage);crop.src=sourceCanvas.toDataURL("image/jpeg",.92)}};
$("showCrop").onchange=e=>crop.classList.toggle("hidden",!e.target.checked);

function makeTableCrop(img){
 const W=img.naturalWidth,H=img.naturalHeight;
 // このSカードの「日付・出・退」表。元写真の縦長比率に合わせ、表全体を広めに切り出す。
 const sx=Math.round(W*.105), sy=Math.round(H*.235), sw=Math.round(W*.62), sh=Math.round(H*.285);
 const c=document.createElement("canvas");c.width=sw*3;c.height=sh*3;
 c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
 return c
}
function variants(canvas){
 const out=[];
 const src=canvas.getContext("2d").getImageData(0,0,canvas.width,canvas.height);
 for(const mode of ["gray","threshold"]){
  const c=document.createElement("canvas");c.width=canvas.width;c.height=canvas.height;const ctx=c.getContext("2d");ctx.putImageData(src,0,0);
  const d=ctx.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){let g=.299*p[i]+.587*p[i+1]+.114*p[i+2];if(mode==="gray"){g=Math.max(0,Math.min(255,(g-110)*1.8+120));p[i]=p[i+1]=p[i+2]=g}else{let v=g<155?0:255;p[i]=p[i+1]=p[i+2]=v}}
  ctx.putImageData(d,0,0);out.push(c)
 }
 return out
}
async function readCell(canvas,rx,ry,rw,rh){
 let best="";
 for(const v of variants(canvas)){
  const c=document.createElement("canvas");c.width=Math.round(canvas.width*rw);c.height=Math.round(canvas.height*rh);let ctx=c.getContext("2d");
  ctx.drawImage(v,Math.round(canvas.width*rx),Math.round(canvas.height*ry),c.width,c.height,0,0,c.width,c.height);
  const r=await Tesseract.recognize(c,"eng",{config:{tessedit_char_whitelist:"0123456789:",tessedit_pageseg_mode:"7"}});
  let s=r.data.text.trim().replace(/\s/g,"");if(s.length>best.length)best=s;
 }
 return best
}
async function readDay(canvas,ry){
 let s=await readCell(canvas,.00,ry,.15,.055);let m=s.match(/\d{1,2}/);return m?m[0]:""
}
async function readTime(canvas,rx,ry,rw){
 let s=await readCell(canvas,rx,ry,rw,.06);return norm(s)
}
read.onclick=async()=>{
 if(!sourceImage)return;
 read.disabled=true;status.textContent="表の位置を合わせています…";
 try{
  // 表クロップ内の行中心（ヘッダーを除いた実データ6行）
  // 元画像では y≈440,490,535,585,630,675 に相当。
  const rowCenters=[.235,.325,.415,.515,.605,.695];
  const out=[];
  for(let i=0;i<6;i++){
   status.textContent=`${i+1}/6行目を読み取り中…`;
   const y=rowCenters[i];
   const day=await readDay(sourceCanvas,y);
   // 出勤は表左側の「出」欄、退勤は右側の「退」欄（夜勤用）
   const start=await readTime(sourceCanvas,.15,y,.28);
   const end=await readTime(sourceCanvas,.54,y,.40);
   if(day||start||end)out.push({day,start:start||"",end:end||""});
  }
  if(!out.length)throw new Error("empty");
  P().rows=out;save();draw();calc();
  status.innerHTML='<span class="ok">読み取り完了！下の結果を確認・修正してください。</span>';
 }catch(e){
  status.innerHTML='<span class="err">自動読み取りできませんでした。写真をカード全体が入るように撮り直すか、下の欄を修正してください。</span>';
 }finally{read.disabled=false}
};
render();
</script>
</body>
</html>
